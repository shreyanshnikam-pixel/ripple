# Tests Ripple and publishes the static site to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Optional: set a repository variable RIPPLE_API_URL to a deployed Ripple server
# (for shareable surveys and the server-side AI report). Without it, the site runs
# fully in the browser: on-device surveys and bring-your-own-key AI.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commits made by the weekly bill updater don't trigger pushes, so redeploy after it runs.
  workflow_run:
    workflows: ['Update bills from Congress.gov']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Optional: AI reports for every visitor, with your Gemini key kept secret on Cloudflare.
      # Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY
      # (see the README, "AI reports for everyone"). Without them this step is skipped, and
      # visitors can still paste their own free key.
      - name: Deploy the AI service (Cloudflare Worker)
        id: ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Cloudflare or Gemini secrets aren't set, so the hosted AI service is skipped."
            exit 0
          fi
          OWNER="${{ github.repository_owner }}"
          cd worker
          OUT=$(npx -y wrangler@4.148.0 deploy --var "ALLOWED_ORIGINS:https://${OWNER,,}.github.io" 2>&1) || { echo "$OUT"; echo "::warning::The AI service didn't deploy; the site will publish without it."; exit 0; }
          echo "$OUT"
          printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@4.148.0 secret put GEMINI_API_KEY || echo "::warning::Couldn't save the Gemini key on Cloudflare."
          URL=$(echo "$OUT" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1)
          if [ -n "$URL" ]; then echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "AI service: $URL"; else echo "::warning::Couldn't find the AI service's address in Cloudflare's output."; fi
      - name: Build the static site
        env:
          VITE_API_URL: ${{ vars.RIPPLE_API_URL }}
          VITE_AI_URL: ${{ steps.ai.outputs.url || vars.RIPPLE_AI_URL }}
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          export PAGES_BASE="$BASE"
          export SITE_URL="https://${OWNER,,}.github.io${BASE}"
          npx tsc --noEmit
          npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
